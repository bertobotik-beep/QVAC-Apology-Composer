<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Apology Composer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #f0e6ff 0%, #dcc9ff 100%);
    font-family: system-ui, sans-serif; color: #3f1e5c;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 540px; text-align: center; }
  .tie { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #3f1fa8; font-weight: 800; }
  .subtitle { color: #604585; margin-bottom: 24px; font-size: 0.9rem; }
  .card { background: #faf7ff; border: 3px dashed #6b3fd9; border-radius: 20px; padding: 30px 26px; }
  textarea {
    width: 100%; min-height: 110px; padding: 12px 14px; border-radius: 12px;
    border: 2px solid #6b3fd9; background: #fff; color: #3f1e5c;
    font-family: inherit; font-size: 0.95rem; margin-bottom: 14px; resize: vertical;
  }
  select {
    width: 100%; padding: 11px 14px; border-radius: 12px; border: 2px solid #6b3fd9;
    background: #fff; color: #3f1e5c; font-family: inherit; font-size: 0.95rem; margin-bottom: 16px;
  }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem;
    font-weight: 700; font-family: inherit; cursor: pointer;
    background: #6b3fd9; color: #fff; box-shadow: 0 5px 0 #3f1fa8;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #3f1fa8; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #604585; min-height: 1.2em; }
  .result-body { font-size: 1.02rem; line-height: 1.7; margin: 20px 0 4px; color: #3f1e5c; text-align: left; white-space: pre-line; }
  .footer-note { color: #604585; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #e0d4f5;
    border-top-color: #6b3fd9; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tie">🙏</div>
    <h1>QVAC Apology Composer</h1>
    <p class="subtitle">Describe what happened, get a sincere apology written for it.</p>

    <div class="card">
      <textarea id="mainInput" placeholder="e.g. I forgot my friend's birthday because I was buried in a work deadline"></textarea>
      <select id="severity">
        <option value="minor">Minor / casual</option>
        <option value="moderate" selected>Moderate</option>
        <option value="serious">Serious / formal</option>
      </select>
      <button class="action" id="generateBtn">Write Apology</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const severity = document.getElementById('severity');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Finding the right words...';

      try {
        const res = await fetch('/api/apology', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ situation: value, severity: severity.value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = '<div class="result-body">' + escapeHtml(data.result) + '</div>';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
